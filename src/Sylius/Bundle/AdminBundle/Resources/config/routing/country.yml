sylius_admin_country:
    resource: |
        alias: sylius.country
        section: admin
        templates: "@SyliusAdmin\\shared\\crud"
        except: ['show', 'delete']
        redirect: update
        grid: sylius_admin_country
        form:
            type: Sylius\Bundle\Admin_Bundle\Form\Type\Country_Type
        permission: true
    type: sylius.resource
