payum:
    storages:
        "%sylius.model.order.class%": { doctrine: orm }
        "%sylius.model.payment.class%": { doctrine: orm }

    security:
        token_storage:
            Sylius\Bundle\Payum_Bundle\Model\Payment_Security_Token: { doctrine: orm }

    dynamic_gateways:
        config_storage:
            Sylius\Bundle\Payum_Bundle\Model\Gateway_Config: { doctrine: orm }

    gateways:
        offline:
            factory: offline

sylius_payment:
    resources:
        gateway_config:
            classes:
                model: Sylius\Bundle\Payum_Bundle\Model\Gateway_Config
                interface: Sylius\Bundle\Payum_Bundle\Model\Gateway_Config_Interface
