framework:
    workflows:
        !php/const Sylius\Component\Payment\Payment_Request_Transitions::GRAPH:
            type: state_machine
            marking_store:
                type: method
                property: state
            supports:
                - Sylius\Component\Payment\Model\Payment_Request_Interface
            initial_marking: !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_NEW
            places:
                - !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_NEW
                - !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_PROCESSING
                - !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_COMPLETED
                - !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_FAILED
                - !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_CANCELLED
            transitions:
                !php/const Sylius\Component\Payment\Payment_Request_Transitions::TRANSITION_PROCESS:
                    from: !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_NEW
                    to: !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_PROCESSING
                !php/const Sylius\Component\Payment\Payment_Request_Transitions::TRANSITION_COMPLETE:
                    from:
                        - !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_NEW
                        - !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_PROCESSING
                    to: !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_COMPLETED
                !php/const Sylius\Component\Payment\Payment_Request_Transitions::TRANSITION_FAIL:
                    from:
                        - !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_NEW
                        - !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_PROCESSING
                    to: !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_FAILED
                !php/const Sylius\Component\Payment\Payment_Request_Transitions::TRANSITION_CANCEL:
                    from:
                        - !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_NEW
                        - !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_PROCESSING
                    to: !php/const Sylius\Component\Payment\Model\Payment_Request_Interface::STATE_CANCELLED
