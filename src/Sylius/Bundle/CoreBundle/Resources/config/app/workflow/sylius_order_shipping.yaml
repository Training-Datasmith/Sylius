framework:
    workflows:
        !php/const Sylius\Component\Core\Order_Shipping_Transitions::GRAPH:
            type: state_machine
            marking_store:
                type: method
                property: shippingState
            supports:
                - Sylius\Component\Core\Model\Order_Interface
            initial_marking: !php/const Sylius\Component\Core\Order_Shipping_States::STATE_CART
            places:
                - !php/const Sylius\Component\Core\Order_Shipping_States::STATE_CART
                - !php/const Sylius\Component\Core\Order_Shipping_States::STATE_READY
                - !php/const Sylius\Component\Core\Order_Shipping_States::STATE_CANCELLED
                - !php/const Sylius\Component\Core\Order_Shipping_States::STATE_PARTIALLY_SHIPPED
                - !php/const Sylius\Component\Core\Order_Shipping_States::STATE_SHIPPED
            transitions:
                !php/const Sylius\Component\Core\Order_Shipping_Transitions::TRANSITION_REQUEST_SHIPPING:
                    from: !php/const Sylius\Component\Core\Order_Shipping_States::STATE_CART
                    to: !php/const Sylius\Component\Core\Order_Shipping_States::STATE_READY
                !php/const Sylius\Component\Core\Order_Shipping_Transitions::TRANSITION_CANCEL:
                    from: !php/const Sylius\Component\Core\Order_Shipping_States::STATE_READY
                    to: !php/const Sylius\Component\Core\Order_Shipping_States::STATE_CANCELLED
                !php/const Sylius\Component\Core\Order_Shipping_Transitions::TRANSITION_PARTIALLY_SHIP:
                    from: !php/const Sylius\Component\Core\Order_Shipping_States::STATE_READY
                    to: !php/const Sylius\Component\Core\Order_Shipping_States::STATE_PARTIALLY_SHIPPED
                !php/const Sylius\Component\Core\Order_Shipping_Transitions::TRANSITION_SHIP:
                    from: 
                        - !php/const Sylius\Component\Core\Order_Shipping_States::STATE_READY
                        - !php/const Sylius\Component\Core\Order_Shipping_States::STATE_PARTIALLY_SHIPPED
                    to: !php/const Sylius\Component\Core\Order_Shipping_States::STATE_SHIPPED
