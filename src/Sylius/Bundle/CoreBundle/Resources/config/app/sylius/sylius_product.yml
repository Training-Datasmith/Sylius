sylius_product:
    resources:
        product:
            classes:
                model: Sylius\Component\Core\Model\Product
                repository: Sylius\Bundle\Core_Bundle\Doctrine\ORM\Product_Repository
            translation:
                classes:
                    model: Sylius\Component\Core\Model\Product_Translation
        product_variant:
            classes:
                model: Sylius\Component\Core\Model\Product_Variant
                controller: Sylius\Bundle\Core_Bundle\Controller\Product_Variant_Controller
                repository: Sylius\Bundle\Core_Bundle\Doctrine\ORM\Product_Variant_Repository
        product_option:
            classes:
                repository: Sylius\Bundle\Core_Bundle\Doctrine\ORM\Product_Option_Repository
        product_association:
            classes:
                repository: Sylius\Bundle\Core_Bundle\Doctrine\ORM\Product_Association_Repository
