framework:
    workflows:
        !php/const Sylius\Component\Order\Order_Transitions::GRAPH:
            type: state_machine
            marking_store:
                type: method
                property: state
            supports:
                - Sylius\Component\Order\Model\Order_Interface
            initial_marking: !php/const Sylius\Component\Order\Model\Order_Interface::STATE_CART
            places:
                - !php/const Sylius\Component\Order\Model\Order_Interface::STATE_CART
                - !php/const Sylius\Component\Order\Model\Order_Interface::STATE_NEW
                - !php/const Sylius\Component\Order\Model\Order_Interface::STATE_CANCELLED
                - !php/const Sylius\Component\Order\Model\Order_Interface::STATE_FULFILLED
            transitions:
                !php/const Sylius\Component\Order\Order_Transitions::TRANSITION_CREATE:
                    from: !php/const Sylius\Component\Order\Model\Order_Interface::STATE_CART
                    to: !php/const Sylius\Component\Order\Model\Order_Interface::STATE_NEW
                !php/const Sylius\Component\Order\Order_Transitions::TRANSITION_CANCEL:
                    from: !php/const Sylius\Component\Order\Model\Order_Interface::STATE_NEW
                    to: !php/const Sylius\Component\Order\Model\Order_Interface::STATE_CANCELLED
                !php/const Sylius\Component\Order\Order_Transitions::TRANSITION_FULFILL:
                    from: !php/const Sylius\Component\Order\Model\Order_Interface::STATE_NEW
                    to: !php/const Sylius\Component\Order\Model\Order_Interface::STATE_FULFILLED
